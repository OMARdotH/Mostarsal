<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مكتبة عربية رقمية للكتب المتاحة للقراءة والتحميل.">
  <title>مِداد — مكتبة عربية رقمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="مِداد — الصفحة الرئيسية">
        <span class="brand-mark" aria-hidden="true">م</span>
        <span>
          <strong>مِداد</strong>
          <small>مكتبة عربية رقمية</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="التنقل الرئيسي">
        <a class="active" href="index.html">الرئيسية</a>
        <a href="library.html">المكتبة</a>
        <a href="about.html">عن مِداد</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-heading">
        <div class="hero-backdrop" id="heroBackdrop" aria-hidden="true"></div>
        <div class="hero-overlay" aria-hidden="true"></div>

        <div class="hero-content">
          <div class="carousel-wrap">
            <button class="carousel-arrow arrow-next" id="nextBook" type="button" aria-label="الكتاب التالي">‹</button>
            <div class="book-track" id="bookTrack" tabindex="0" aria-label="الكتب الجديدة. استخدم الأسهم للتنقل."></div>
            <button class="carousel-arrow arrow-prev" id="prevBook" type="button" aria-label="الكتاب السابق">›</button>
          </div>

          <div class="featured-info">
            <p class="eyebrow">أضيف حديثًا</p>
            <h1 id="hero-heading"></h1>
            <a class="author-link" id="heroAuthor" href="#"></a>
            <p class="hero-description" id="heroDescription"></p>
            <div class="hero-actions">
              <a class="button button-primary" id="heroDownload" href="#" download>تحميل الكتاب</a>
              <a class="button button-ghost" id="heroDetails" href="#">التفاصيل</a>
            </div>
          </div>

          <div class="carousel-status" id="carouselStatus" aria-live="polite"></div>
        </div>
      </section>

      <section class="intro-section section">
        <div>
          <p class="eyebrow">اكتشف شيئًا جديدًا</p>
          <h2>كتب تستحق أن تبقى معك.</h2>
        </div>
        <a class="text-link" href="library.html">استكشف المكتبة <span>←</span></a>
      </section>

      <section class="mini-grid section" id="miniGrid" aria-label="كتب مختارة"></section>
    </main>

    <footer class="site-footer">
      <span>© <span id="year"></span> مِداد</span>
      <span>صُمّم للقراءة العربية.</span>
    </footer>
  </div>

  <script src="js/books.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
